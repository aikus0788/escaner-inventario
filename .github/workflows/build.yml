name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Compilar
        env:
          STORE_PASSWORD: inventario123
        run: gradle assembleRelease --no-daemon --stacktrace -Pcompilacion=${{ github.run_number }}
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk EscanerInventario.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EscanerInventario
          path: EscanerInventario.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Escáner de Inventario v1.2.${{ github.run_number }}
          files: EscanerInventario.apk
