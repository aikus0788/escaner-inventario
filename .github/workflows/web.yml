name: Publicar versión web

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/web.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Marcar versión (así los teléfonos reciben la nueva)
        run: |
          V="1.0.${{ github.run_number }}"
          sed -i "s/__VERSION__/$V/" web/sw.js web/js/base.js
          grep -n "$V" web/sw.js web/js/base.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
