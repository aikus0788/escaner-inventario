name: Compilar APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'web/**', '.github/workflows/web.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Probar Excel con fotos
        run: gradle testDebugUnitTest --no-daemon --stacktrace -Pcompilacion=${{ github.run_number }}
      - name: Revisar el Excel de prueba
        run: |
          pip install --quiet openpyxl pillow
          python3 .github/scripts/validar_excel.py app/build/prueba-fotos.xlsx
      - name: Publicar vista previa de la OT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls app/build/ot-preview-*.png >/dev/null 2>&1; then
            mkdir -p /tmp/vp && cp app/build/ot-preview-*.png /tmp/vp/ && cd /tmp/vp
            git init -q && git checkout -q -b vista-previa
            git -c user.name="github-actions" -c user.email="actions@github.com" add . 
            git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Vista previa OT (${{ github.run_number }})"
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" vista-previa
          fi
      - name: Compilar
        env:
          STORE_PASSWORD: inventario123
        run: gradle assembleRelease --no-daemon --stacktrace -Pcompilacion=${{ github.run_number }}
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Infomaxis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Infomaxis
          path: Infomaxis.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Infomaxis v2.0.${{ github.run_number }}
          files: Infomaxis.apk
